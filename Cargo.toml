[workspace]
members = [
  "crates/astra-core",
  "crates/astra-capabilities",
  "crates/astra-nova",
  "crates/astra-compiler-api",
  "crates/astra-wasm",
  "crates/astra-codegen-c",
  "crates/astra-nopm",
  "crates/astra-cli",
  "crates/astra-lsp",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
astra-core = { path = "crates/astra-core" }
astra-capabilities = { path = "crates/astra-capabilities" }
astra-nova = { path = "crates/astra-nova" }
astra-compiler-api = { path = "crates/astra-compiler-api" }
astra-codegen-c = { path = "crates/astra-codegen-c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
